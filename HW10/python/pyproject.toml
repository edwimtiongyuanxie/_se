[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-week10-YOURNAME"          # ← 請改成唯一名稱（建議加上學號）
version = "0.1.0"
description = "HW10 example package for PyPI"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
keywords = ["hw10", "example", "week10"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/YOUR_GITHUB_USERNAME/HW10"
Repository = "https://github.com/YOUR_GITHUB_USERNAME/HW10"

[tool.setuptools.packages.find]
where = ["src"]
